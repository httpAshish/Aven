<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" role="img" aria-label="AVEN Smart Portable Power Bank">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F9FF"/>
      <stop offset="100%" stop-color="#E6F2FF"/>
    </radialGradient>
    <linearGradient id="pbShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#DCEBFA"/>
    </linearGradient>
    <linearGradient id="pbSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0756B9"/>
      <stop offset="50%" stop-color="#1E75FF"/>
      <stop offset="100%" stop-color="#07172F"/>
    </linearGradient>
    <linearGradient id="ledScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192E"/>
      <stop offset="100%" stop-color="#040B16"/>
    </linearGradient>
    <linearGradient id="torchGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FDB022" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDB022" stop-opacity="0"/>
    </linearGradient>
    <filter id="pbShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0756B9" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07172F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Clean White/Studio Background -->
  <rect width="800" height="800" rx="28" fill="url(#studioBg)"/>

  <!-- Subtle Studio Backdrop Halo -->
  <circle cx="400" cy="390" r="260" fill="#42A9EF" opacity="0.08"/>
  <circle cx="400" cy="390" r="200" fill="#0756B9" opacity="0.05"/>
  <ellipse cx="400" cy="655" rx="165" ry="22" fill="#07172F" opacity="0.12"/>

  <!-- Top Section Pill -->
  <g transform="translate(245, 34)" filter="url(#badgeShadow)">
    <rect width="310" height="40" rx="20" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#0756B9"/>
    <text x="40" y="25" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="700" fill="#07172F" letter-spacing="0.06em">AVEN SMART POWER BANK</text>
  </g>

  <!-- Torchlight Beam Effect at Top of Power Bank -->
  <polygon points="355,148 445,148 485,82 315,82" fill="url(#torchGlow)"/>

  <!-- ================= MAIN POWER BANK BODY ================= -->
  <g transform="translate(260, 140)" filter="url(#pbShadow)">
    <!-- 3D Side Bezel Accent -->
    <rect x="-8" y="8" width="296" height="484" rx="46" fill="url(#pbSide)"/>

    <!-- Main Sleek Matte White/Silver Casing -->
    <rect x="0" y="0" width="280" height="480" rx="42" fill="url(#pbShell)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Top Edge Port & Torchlight Bar -->
    <rect x="65" y="0" width="150" height="12" rx="6" fill="#07172F"/>
    <!-- Built-in LED Torchlight Lens -->
    <rect x="115" y="2" width="50" height="8" rx="4" fill="#FDB022"/>

    <!-- Digital LED Battery Display Panel -->
    <rect x="38" y="42" width="204" height="126" rx="22" fill="url(#ledScreen)" stroke="#1E4276" stroke-width="2"/>

    <!-- Digital LED Display Readout -->
    <text x="140" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#42A9EF" letter-spacing="0.12em">BATTERY LEVEL</text>
    <text x="140" y="128" text-anchor="middle" font-family="Poppins, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">100<tspan font-size="24" fill="#12B76A">%</tspan></text>
    <g transform="translate(82, 142)">
      <circle cx="8" cy="6" r="4" fill="#12B76A"/>
      <text x="18" y="10" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#32D583" letter-spacing="0.06em">FAST CHARGING</text>
    </g>

    <!-- AVEN Center Brand Emblem -->
    <g transform="translate(75, 220)">
      <!-- A Emblem -->
      <path d="M 10 48 L 28 4 L 38 4 L 20 48 Z" fill="#0756B9"/>
      <path d="M 34 4 L 52 48 L 42 48 L 28 16 Z" fill="#07172F"/>
      <path d="M 6 34 Q 30 20 58 28 Q 34 32 6 34 Z" fill="#42A9EF"/>
      <text x="64" y="34" font-family="Poppins, sans-serif" font-size="26" font-weight="800" fill="#07172F" letter-spacing="0.04em">AVEN</text>
      <text x="65" y="49" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#0756B9" letter-spacing="0.08em">POWER. ON YOUR WAY.</text>
    </g>

    <!-- Integrated Multi-Device Cable Slots Groove -->
    <rect x="34" y="305" width="212" height="110" rx="16" fill="#EAF4FF" stroke="#BFE3FF" stroke-width="1.5"/>
    <text x="140" y="328" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#0756B9" letter-spacing="0.06em">DUAL INPUT &amp; MULTI-DEVICE OUTPUT</text>

    <!-- Port Icons Row inside Groove -->
    <g transform="translate(50, 344)">
      <!-- Type-C Port -->
      <rect x="0" y="0" width="82" height="52" rx="10" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
      <rect x="25" y="14" width="32" height="10" rx="5" fill="#07172F"/>
      <rect x="30" y="17" width="22" height="4" rx="2" fill="#42A9EF"/>
      <text x="41" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#07172F">Type-C</text>

      <!-- Micro-USB Port -->
      <rect x="98" y="0" width="82" height="52" rx="10" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
      <polygon points="127,14 151,14 155,24 123,24" fill="#07172F"/>
      <rect x="130" y="17" width="18" height="3" fill="#42A9EF"/>
      <text x="139" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#07172F">Micro-USB</text>
    </g>

    <!-- Bottom Safety & Certification Line -->
    <text x="140" y="448" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#68788C" letter-spacing="0.08em">CE • FC • RoHS • SMART IC PROTECTION</text>
  </g>

  <!-- ================= CALLOUT FEATURE BADGES ================= -->
  <!-- Callout 1: Top Left - Digital LED Display -->
  <g transform="translate(28, 185)" filter="url(#badgeShadow)">
    <rect width="195" height="76" rx="16" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="18" fill="#EAF4FF"/>
    <text x="34" y="43" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="800" fill="#0756B9">LED</text>
    <text x="62" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#07172F">Digital Display</text>
    <text x="62" y="52" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Real-time battery %</text>
  </g>

  <!-- Callout 2: Top Right - Built-in Torchlight -->
  <g transform="translate(577, 185)" filter="url(#badgeShadow)">
    <rect width="195" height="76" rx="16" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="18" fill="#FEF3C7"/>
    <circle cx="34" cy="38" r="8" fill="#F59E0B"/>
    <text x="62" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#07172F">Built-in Torch</text>
    <text x="62" y="52" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Low-light utility LED</text>
  </g>

  <!-- Callout 3: Bottom Left - Dual Input Ports -->
  <g transform="translate(28, 435)" filter="url(#badgeShadow)">
    <rect width="195" height="76" rx="16" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="18" fill="#EAF4FF"/>
    <rect x="25" y="34" width="18" height="8" rx="4" fill="#0756B9"/>
    <text x="62" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#07172F">Dual Input Ports</text>
    <text x="62" y="52" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Type-C &amp; Micro-USB</text>
  </g>

  <!-- Callout 4: Bottom Right - Universal Compatibility -->
  <g transform="translate(577, 435)" filter="url(#badgeShadow)">
    <rect width="195" height="76" rx="16" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="18" fill="#E7F9F0"/>
    <path d="M36 27 L28 39 H34 L32 49 L40 37 H34 Z" fill="#12B76A"/>
    <text x="62" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#07172F">Multi-Device</text>
    <text x="62" y="52" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Phones, Buds, Watch</text>
  </g>

  <!-- Bottom Device Compatibility Strip -->
  <g transform="translate(115, 700)" filter="url(#badgeShadow)">
    <rect width="570" height="54" rx="27" fill="#07172F"/>
    <text x="285" y="32" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.03em">📱 Smartphones  •  🎧 Earbuds  •  ⌚ Smartwatches  •  💻 Tablets  •  🕶️ Smart Glasses</text>
  </g>
</svg>

