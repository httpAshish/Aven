<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%" role="img" aria-label="AVEN Smart Power Bank Rental Ecosystem">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F2FF"/>
    </linearGradient>
    <linearGradient id="navyBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D264C"/>
      <stop offset="100%" stop-color="#07172F"/>
    </linearGradient>
    <linearGradient id="bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0756B9"/>
      <stop offset="100%" stop-color="#42A9EF"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E75FF"/>
      <stop offset="100%" stop-color="#0756B9"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B76A"/>
      <stop offset="100%" stop-color="#32D583"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0756B9" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07172F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="680" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative Grid & Glow Circles -->
  <circle cx="680" cy="110" r="160" fill="#42A9EF" opacity="0.10"/>
  <circle cx="110" cy="560" r="180" fill="#0756B9" opacity="0.08"/>
  <circle cx="400" cy="340" r="245" fill="none" stroke="#42A9EF" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.35"/>
  <circle cx="400" cy="340" r="305" fill="none" stroke="#0756B9" stroke-width="1" stroke-dasharray="4 10" opacity="0.2"/>

  <!-- Top Header Pill -->
  <g transform="translate(235, 28)" filter="url(#softShadow)">
    <rect width="330" height="40" rx="20" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#12B76A"/>
    <text x="40" y="25" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="700" fill="#07172F" letter-spacing="0.06em">SMART RENTAL NETWORK INDIA</text>
  </g>

  <!-- Connection Lines from Central Kiosk to Ecosystem Cards -->
  <g stroke="url(#bluePrimary)" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.55">
    <path d="M 290 220 L 185 165"/>
    <path d="M 510 220 L 615 165"/>
    <path d="M 290 430 L 185 485"/>
    <path d="M 510 430 L 615 485"/>
  </g>

  <!-- ================= CENTRAL AVEN SMART KIOSK ================= -->
  <g transform="translate(295, 115)" filter="url(#cardShadow)">
    <!-- Base Stand -->
    <rect x="-15" y="425" width="240" height="24" rx="10" fill="#07172F"/>
    <rect x="5" y="415" width="200" height="14" rx="4" fill="#0D264C"/>

    <!-- Kiosk Main Tower -->
    <rect x="0" y="0" width="210" height="420" rx="22" fill="url(#navyBody)" stroke="#1E4276" stroke-width="2"/>

    <!-- Top Cyan Status Bar -->
    <rect x="45" y="16" width="120" height="5" rx="2.5" fill="#42A9EF"/>

    <!-- Interactive Touch Screen -->
    <rect x="18" y="32" width="174" height="145" rx="12" fill="url(#screenGlow)" stroke="#42A9EF" stroke-width="1.5"/>

    <!-- Screen Content: AVEN Brand + QR Code -->
    <text x="105" y="60" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.08em">AVEN</text>
    <text x="105" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#D6E9FB">SCAN QR TO RENT IN SECONDS</text>

    <!-- QR Box on Screen -->
    <rect x="75" y="86" width="60" height="60" rx="8" fill="#FFFFFF"/>
    <g fill="#07172F" transform="translate(83, 94)">
      <rect x="0" y="0" width="14" height="14" rx="2"/>
      <rect x="3" y="3" width="8" height="8" fill="#FFFFFF"/>
      <rect x="5" y="5" width="4" height="4"/>
      <rect x="30" y="0" width="14" height="14" rx="2"/>
      <rect x="33" y="3" width="8" height="8" fill="#FFFFFF"/>
      <rect x="35" y="5" width="4" height="4"/>
      <rect x="0" y="30" width="14" height="14" rx="2"/>
      <rect x="3" y="33" width="8" height="8" fill="#FFFFFF"/>
      <rect x="5" y="35" width="4" height="4"/>
      <rect x="18" y="4" width="8" height="4"/>
      <rect x="18" y="12" width="8" height="8"/>
      <rect x="18" y="24" width="12" height="6"/>
      <rect x="32" y="18" width="10" height="8"/>
      <rect x="20" y="34" width="10" height="10"/>
      <rect x="34" y="34" width="10" height="10" fill="#0756B9"/>
    </g>
    <text x="105" y="164" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#BFE3FF">● READY FOR RENTAL</text>

    <!-- Power Bank Rental Slots (4 Rows x 2 Columns = 8 Bays) -->
    <g transform="translate(22, 195)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="5" y="5" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="60" cy="16" r="3.5" fill="#12B76A"/>
      <rect x="8" y="14" width="28" height="4" rx="2" fill="#0756B9"/>

      <rect x="90" y="0" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="95" y="5" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="150" cy="16" r="3.5" fill="#12B76A"/>
      <rect x="98" y="14" width="28" height="4" rx="2" fill="#0756B9"/>

      <!-- Row 2 -->
      <rect x="0" y="42" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="5" y="47" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="60" cy="58" r="3.5" fill="#12B76A"/>
      <rect x="8" y="56" width="28" height="4" rx="2" fill="#0756B9"/>

      <rect x="90" y="42" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="95" y="47" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="150" cy="58" r="3.5" fill="#12B76A"/>
      <rect x="98" y="56" width="28" height="4" rx="2" fill="#0756B9"/>

      <!-- Row 3 -->
      <rect x="0" y="84" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="5" y="89" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="60" cy="100" r="3.5" fill="#12B76A"/>
      <rect x="8" y="98" width="28" height="4" rx="2" fill="#0756B9"/>

      <rect x="90" y="84" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="95" y="89" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="150" cy="100" r="3.5" fill="#12B76A"/>
      <rect x="98" y="98" width="28" height="4" rx="2" fill="#0756B9"/>

      <!-- Row 4 -->
      <rect x="0" y="126" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="5" y="131" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="60" cy="142" r="3.5" fill="#12B76A"/>
      <rect x="8" y="140" width="28" height="4" rx="2" fill="#0756B9"/>

      <rect x="90" y="126" width="76" height="32" rx="6" fill="#040D1A"/>
      <rect x="95" y="131" width="66" height="22" rx="4" fill="#F8FAFC"/>
      <circle cx="150" cy="142" r="3.5" fill="#12B76A"/>
      <rect x="98" y="140" width="28" height="4" rx="2" fill="#0756B9"/>
    </g>

    <!-- Bottom Kiosk Brand Panel -->
    <rect x="22" y="368" width="166" height="34" rx="8" fill="#0B2A55" stroke="#42A9EF" stroke-width="1"/>
    <text x="105" y="390" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11.5" font-weight="700" fill="#42A9EF" letter-spacing="0.08em">POWER. ON YOUR WAY.</text>
  </g>

  <!-- ================= FLOATING FEATURE CARDS ================= -->
  <!-- Card 1: Top Left - Scan & Rent -->
  <g transform="translate(36, 105)" filter="url(#softShadow)">
    <rect width="215" height="96" rx="18" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <rect x="16" y="20" width="48" height="48" rx="12" fill="#EAF4FF"/>
    <path d="M32 34 h6 v6 h-6 z M42 34 h6 v6 h-6 z M32 44 h6 v6 h-6 z M42 44 h6 v6 h-6 z" fill="#0756B9"/>
    <text x="76" y="40" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#07172F">1. Scan &amp; Rent</text>
    <text x="76" y="58" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">Automated self-service</text>
    <text x="76" y="73" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">kiosks in seconds</text>
  </g>

  <!-- Card 2: Top Right - Charge On The Move -->
  <g transform="translate(549, 105)" filter="url(#softShadow)">
    <rect width="215" height="96" rx="18" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <rect x="16" y="20" width="48" height="48" rx="12" fill="#E7F9F0"/>
    <path d="M42 30 L33 45 H40 L38 56 L47 41 H40 Z" fill="#12B76A"/>
    <text x="76" y="40" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#07172F">2. Charge On-Go</text>
    <text x="76" y="58" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">Phones, earbuds, tablets</text>
    <text x="76" y="73" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">&amp; USB devices</text>
  </g>

  <!-- Card 3: Bottom Left - High-Footfall Locations -->
  <g transform="translate(36, 440)" filter="url(#softShadow)">
    <rect width="215" height="104" rx="18" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <rect x="16" y="22" width="48" height="48" rx="12" fill="#EAF4FF"/>
    <circle cx="40" cy="43" r="6" fill="#0756B9"/>
    <path d="M40 29 C32 29 26 35 26 43 C26 53 40 63 40 63 C40 63 54 53 54 43 C54 35 48 29 40 29 Z" fill="none" stroke="#0756B9" stroke-width="2.5"/>
    <text x="76" y="40" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#07172F">Everywhere You Go</text>
    <text x="76" y="58" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Airports • Malls • Colleges</text>
    <text x="76" y="74" font-family="Inter, sans-serif" font-size="11" fill="#68788C">Cafés • Offices • Events</text>
  </g>

  <!-- Card 4: Bottom Right - Easy Return -->
  <g transform="translate(549, 440)" filter="url(#softShadow)">
    <rect width="215" height="104" rx="18" fill="#FFFFFF" stroke="#D6E9FB" stroke-width="1.5"/>
    <rect x="16" y="22" width="48" height="48" rx="12" fill="#EAF4FF"/>
    <path d="M30 46 H48 M42 39 L49 46 L42 53" stroke="#0756B9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="76" y="40" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#07172F">3. Easy Return</text>
    <text x="76" y="58" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">Drop off at any nearby</text>
    <text x="76" y="74" font-family="Inter, sans-serif" font-size="11.5" fill="#68788C">participating AVEN station</text>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(150, 595)" filter="url(#softShadow)">
    <rect width="500" height="54" rx="27" fill="url(#bluePrimary)"/>
    <text x="250" y="33" text-anchor="middle" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="0.03em">⚡ Never Let a Dead Battery Slow You Down</text>
  </g>
</svg>

